name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[llm,dev,mcp,learned]" plotly pandas
      - name: pytest
        env:
          AGENTSYNTH_FORCE_MOCK: "1"
        run: pytest --cov=agentsynth --cov-report=xml --cov-report=term-missing
      - name: validate packs
        env:
          AGENTSYNTH_FORCE_MOCK: "1"
        run: |
          python -m agentsynth.cli pack validate packs/core_v1.yaml \
            --oracle examples/core_v1_oracle.py:solve
          for f in packs/*.yaml; do
            [ "$f" = "packs/core_v1.yaml" ] && continue
            python -m agentsynth.cli pack validate "$f"
          done
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  app:
    name: app import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[app]"
      - name: Build the Gradio Blocks without launching
        env:
          AGENTSYNTH_FORCE_MOCK: "1"
        run: python -c "import app; assert app.demo is not None; print('app import OK')"

  build:
    name: build + check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bench-action:
    name: bench action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e .
      - name: gate on the oracle (must hold a perfect pass^2)
        uses: ./
        env:
          AGENTSYNTH_FORCE_MOCK: "1"
        with:
          pack: packs/core_v1.yaml
          policy: examples/core_v1_oracle.py:solve
          trials: "2"
          min-pass-rate: "1.0"
          install: "false"
