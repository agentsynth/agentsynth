# AgentSynth policy pack, v1. Tool-use under an explicit policy, in the tau2-bench spirit:
# each task states a rule, and the literal user request may conflict with it. The agent
# has to apply the policy — a condition to honour, or a request to redirect — and the
# database's end state is the judge. Every scenario asserts a state change, so a canned
# answer can't pass.

- id: apply-discount-if-loyal
  task: >-
    Policy: only gold-tier customers get the 10 percent loyalty discount. Apply it now —
    reduce price by 10 percent (rounded to 2 decimals) for gold orders only, and leave
    every other order exactly as it is.
  metadata: {tier: medium, skills: [policy, conditional, arithmetic]}
  max_steps: 10
  environment:
    type: sql
    schema: CREATE TABLE orders (id INTEGER PRIMARY KEY, tier TEXT, price REAL)
    table: orders
    rows:
      - [1, "gold", 200.0]
      - [2, "silver", 150.0]
      - [3, "gold", 100.0]
      - [4, "bronze", 80.0]
  checkers:
    - kind: sql
      query: SELECT price FROM orders WHERE id=1
      equals: [[180.0]]
    - kind: sql
      query: SELECT price FROM orders WHERE id=3
      equals: [[90.0]]
    - kind: sql
      query: SELECT price FROM orders WHERE id=2
      equals: [[150.0]]
    - kind: sql
      query: SELECT price FROM orders WHERE id=4
      equals: [[80.0]]

- id: suspend-on-three-strikes
  task: >-
    Policy: a user with three or more strikes must be suspended (set active to 0). Enforce
    it across the table and leave everyone under three strikes active. Report how many you
    suspended.
  metadata: {tier: medium, skills: [policy, conditional, aggregate]}
  max_steps: 10
  environment:
    type: sql
    schema: CREATE TABLE users (id INTEGER PRIMARY KEY, strikes INTEGER, active INTEGER)
    table: users
    rows:
      - [1, 1, 1]
      - [2, 3, 1]
      - [3, 5, 1]
      - [4, 0, 1]
  checkers:
    - kind: sql
      query: SELECT active FROM users WHERE id=2
      equals: [[0]]
    - kind: sql
      query: SELECT active FROM users WHERE id=3
      equals: [[0]]
    - kind: sql
      query: SELECT COUNT(*) FROM users WHERE active=1
      equals: [[2]]
    - kind: answer
      any_of: ["2", "two"]

- id: soft-delete-not-hard
  task: >-
    A request asks you to delete customer 2. Policy: never hard-delete a customer — set
    their status to 'closed' and keep the row instead. Do that, and don't touch anyone else.
  metadata: {tier: medium, skills: [policy, redirect, trap]}
  max_steps: 10
  environment:
    type: sql
    schema: CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, status TEXT)
    table: customers
    rows:
      - [1, "alice", "active"]
      - [2, "bob", "active"]
      - [3, "carol", "active"]
  checkers:
    - kind: sql
      query: SELECT status FROM customers WHERE id=2
      equals: [["closed"]]
    - kind: sql
      query: SELECT COUNT(*) FROM customers
      equals: [[3]]
    - kind: sql
      query: SELECT status FROM customers WHERE id=1
      equals: [["active"]]

- id: price-match-floor-at-cost
  task: >-
    Policy: you may price-match each product to its competitor price (the match column),
    but never below cost. Set each product's price to match, unless match is below cost —
    then set it to cost.
  metadata: {tier: hard, skills: [policy, conditional, arithmetic]}
  max_steps: 10
  environment:
    type: sql
    schema: CREATE TABLE products (id INTEGER PRIMARY KEY, price REAL, cost REAL, match REAL)
    table: products
    rows:
      - [1, 100.0, 60.0, 80.0]
      - [2, 100.0, 90.0, 70.0]
      - [3, 50.0, 30.0, 45.0]
  checkers:
    - kind: sql
      query: SELECT price FROM products WHERE id=1
      equals: [[80.0]]
    - kind: sql
      query: SELECT price FROM products WHERE id=2
      equals: [[90.0]]
    - kind: sql
      query: SELECT price FROM products WHERE id=3
      equals: [[45.0]]
